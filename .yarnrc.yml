yarnPath: .yarn/releases/yarn-4.18.1.cjs
nodeLinker: node-modules

# A version is installed only once it has been on the registry for a day: compromised releases are
# usually caught and unpublished within hours, so the delay keeps them out of the lockfile.
# Minutes rather than a duration string, because Dependabot reads the gate only as a plain number.
# The cooldown in .github/dependabot.yml has to stay at least as long: Dependabot picks a version
# without looking at this gate and would otherwise propose one that yarn refuses to install.
# An urgent fix that cannot wait a day goes in with `YARN_NPM_MINIMAL_AGE_GATE=0 yarn up <name>`.
npmMinimalAgeGate: 1440

# Our own packages are published by us and are taken without the delay.
npmPreapprovedPackages:
  - '@koobiq/*'
